<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 应用教学开放日 · 报名</title>
  <!-- 全局样式：校园深蓝主题（复用既有类名，不新增全局样式） -->
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- 少量页面级微调：仅补充既有类名未覆盖的排布 -->
  <style>
    /* 成功页大图标：字号与居中由页面自行微调 */
    .success-icon { font-size: 52px; line-height: 1; text-align: center; margin: 8px 0 4px; }
    /* 按钮行：横向排列，窄屏自动换行 */
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
    .btn-row .btn { flex: 1 1 auto; }
    /* 查询行：输入框 + 按钮同行，底部对齐 */
    .query-inline { display: flex; gap: 12px; align-items: flex-end; }
    .query-inline .form-group { flex: 1 1 auto; margin-bottom: 0; }
  </style>
</head>
<body>
  <!-- 顶栏：标题 + 活泼亲切副标题 -->
  <header class="site-header">
    <div class="container">
      <h1>AI 应用教学开放日</h1>
      <p>快来报名，一起玩转 AI 课堂吧～</p>
    </div>
  </header>

  <main class="container">

    <!-- ============ 视图 1 · 报名页（默认显示） ============ -->
    <section id="view-signup" class="view active">
      <div class="card">
        <h2 class="page-title">活动报名</h2>
        <p class="muted">填几行小信息，就能锁定你心仪的场次，超简单～</p>

        <!-- 场次介绍区：由 user.js 从 Store.SESSIONS 渲染 -->
        <div id="session-info" class="result-card"></div>

        <h3 class="section-title">填写报名信息</h3>
        <!-- 关闭浏览器原生校验，统一由 user.js 输出红色中文提示 -->
        <form id="signup-form" novalidate>
          <!-- 姓名：必填 -->
          <div class="form-group">
            <label class="form-label required" for="input-name">姓名</label>
            <input class="form-control" id="input-name" name="name" type="text"
                   placeholder="请输入你的姓名" autocomplete="name">
            <div class="form-error" id="error-name"></div>
          </div>

          <!-- 身份：非必填，由 Store.ROLES 渲染 -->
          <div class="form-group">
            <label class="form-label" for="input-role">身份</label>
            <select class="form-control" id="input-role" name="role">
              <option value="">请选择身份</option>
            </select>
            <div class="form-error" id="error-role"></div>
          </div>

          <!-- 院系：非必填 -->
          <div class="form-group">
            <label class="form-label" for="input-department">院系</label>
            <input class="form-control" id="input-department" name="department" type="text"
                   placeholder="选填，比如计算机系">
            <div class="form-error" id="error-department"></div>
          </div>

          <!-- 手机号：必填 -->
          <div class="form-group">
            <label class="form-label required" for="input-phone">手机号</label>
            <input class="form-control" id="input-phone" name="phone" type="text"
                   placeholder="请输入 11 位手机号" autocomplete="tel" maxlength="11">
            <div class="form-error" id="error-phone"></div>
          </div>

          <!-- 参加场次：必填，由 Store.SESSIONS 渲染 -->
          <div class="form-group">
            <label class="form-label required" for="input-session">参加场次</label>
            <select class="form-control" id="input-session" name="session">
              <option value="">请选择场次</option>
            </select>
            <div class="form-error" id="error-session"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">提交报名</button>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost btn-block" id="go-query">查询报名状态</button>
          </div>
        </form>
      </div>
    </section>

    <!-- ============ 视图 2 · 报名成功页 ============ -->
    <section id="view-success" class="view">
      <div class="card">
        <div class="success-icon">🎉</div>
        <h2 class="page-title">太棒了，报名成功！</h2>
        <p class="muted">我们已经帮你记下啦，到时候见哦～</p>

        <!-- 回执：报名人姓名 + 参加场次（含时间与地点） -->
        <div class="result-card">
          <div class="result-row">
            <span class="result-label">报名人姓名</span>
            <span class="result-value" id="success-name">—</span>
          </div>
          <div class="result-row">
            <span class="result-label">参加场次</span>
            <span class="result-value" id="success-session">—</span>
          </div>
        </div>

        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="success-home">返回首页</button>
          <button type="button" class="btn btn-ghost" id="success-query">查询报名状态</button>
        </div>
      </div>
    </section>

    <!-- ============ 视图 3 · 报名状态查询页 ============ -->
    <section id="view-query" class="view">
      <div class="card">
        <h2 class="page-title">查询报名状态</h2>
        <p class="muted">输入报名时填的手机号，马上就能查到你的报名信息～</p>

        <div class="query-inline">
          <div class="form-group">
            <label class="form-label" for="query-phone">手机号</label>
            <input class="form-control" id="query-phone" type="text"
                   placeholder="请输入 11 位手机号" maxlength="11">
          </div>
          <button type="button" class="btn btn-accent" id="btn-query">查询</button>
        </div>

        <!-- 查询结果渲染容器 -->
        <div id="query-result"></div>

        <div class="btn-row">
          <button type="button" class="btn btn-ghost" id="query-back">返回报名页</button>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    「AI 应用教学开放日」报名系统 · 报名数据将提交至服务器保存，可凭手机号随时查询。
  </footer>

  <!-- 经典 script：先数据层，后用户端逻辑（非 ES module） -->
  <script src="assets/js/store.js"></script>
  <script src="assets/js/user.js"></script>
</body>
</html>
